{% extends "templates/web.html" %}

{% block title %}Sample Registration Dashboard{% endblock %}

{% block page_content %}
<div class="container">
	<h2>Sample Registration Summary by Customer</h2>
	<div class="row">
		<div class="col-md-12">
			<div id="sample-chart-container" style="min-height: 400px;"></div>
		</div>
	</div>
</div>

<script>
frappe.ready(function() {
	// Fetch chart data
	frappe.call({
		method: 'qbs_ultra_lube.qbs_ultra_plus_lubes_pvt_ltd.doctype.sample_registration.sample_registration_chart.get_sample_registration_summary',
		callback: function(r) {
			if (r.message) {
				// Create the chart
				const chart = new frappe.Chart("#sample-chart-container", {
					title: "Sample Registrations by Customer",
					data: r.message,
					type: 'bar',
					height: 400,
					colors: ['#7cd6fd', '#5e64ff', '#743ee2'],
					barOptions: {
						stacked: 0,
						spaceRatio: 0.5
					}
				});
			}
		}
	});
});
</script>
{% endblock %}
